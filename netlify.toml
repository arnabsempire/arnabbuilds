# Netlify build configuration for arnabbuilds.com
#
# The Next.js adapter is declared here rather than left to auto-detection.
# Auto-install is per-project, not per-repo: the preview project picked the
# adapter up through the Netlify UI, but the production project did not, and
# its first build published the raw .next directory with no server handler —
# "No functions deployed" — which breaks routing on every path.
#
# The version is deliberately unpinned. Netlify's own guidance is not to pin
# it: they maintain the adapter across Next.js versions and resolve the latest
# compatible one on each build. Declaring the package without a version gets
# both — guaranteed presence, automatic updates.

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 requires Node 20.9+. Pinned so CI matches local.
  NODE_VERSION = "22"

# Security headers are set here rather than in next.config.mjs so there is one
# source of truth, applied by Netlify's CDN to every asset including static
# files that never touch the Next.js server.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Next fingerprints these filenames, so they can be cached permanently.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/arnab-aditya-das.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
