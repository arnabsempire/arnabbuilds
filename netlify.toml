# Netlify build configuration for arnabbuilds.com
#
# The Next.js adapter (@netlify/plugin-nextjs) is installed and kept current by
# Netlify automatically. Netlify explicitly recommends NOT pinning it — "we
# actively maintain the adapter to support all Next.js versions starting from
# 13.5 and, if you don't pin the version, we will automatically use the latest
# version on each project build for you." It is therefore deliberately absent
# from package.json and from a [[plugins]] block here.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 requires Node 20.9+. Pinned so CI matches local.
  NODE_VERSION = "22"

# Security headers are set here rather than in next.config.mjs so there is one
# source of truth, applied by Netlify's CDN to every asset including static
# files that never touch the Next.js server.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Next fingerprints these filenames, so they can be cached permanently.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/arnab-aditya-das.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
