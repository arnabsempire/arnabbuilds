# Netlify build configuration for arnabbuilds.com
#
# Kept deliberately, even though the site now deploys to Cloudflare: the build
# is a static export, so the same repo publishes correctly on either host and
# moving back is a DNS change rather than a rewrite.
#
# @netlify/plugin-nextjs is NOT declared any more, and must not be re-added.
# The adapter exists to deploy a Next.js *server* to Netlify Functions. This
# build has no server — `output: 'export'` in next.config.mjs emits a finished
# `out/` directory — so the adapter would wrap static files in a function that
# does nothing, and bill compute for it.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Next.js 16 requires Node 20.9+. Pinned so CI matches local.
  NODE_VERSION = "22"

# These mirror public/_headers, which is what Cloudflare reads. Netlify ignores
# _headers when a netlify.toml is present, so both files have to carry the rules.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Next fingerprints these filenames, so they can be cached permanently.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/arnab-aditya-das.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
